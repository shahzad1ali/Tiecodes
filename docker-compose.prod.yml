# Production stack: app + MySQL on one server.
# Copy .env.example → .env, set strong secrets, then:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tiecodes}
      MYSQL_USER: ${MYSQL_USER:-tiecodes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - tiecodes_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - tiecodes

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-tiecodes}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-tiecodes}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-portfolio}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
    volumes:
      - tiecodes_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiecodes

volumes:
  tiecodes_mysql_data:
  tiecodes_uploads:

networks:
  tiecodes:
