# Local development MySQL only (not for production).
# Production: use docker-compose.prod.yml or a managed MySQL + the Dockerfile.

services:
  mysql:
    image: mysql:8.4
    container_name: tiecodes-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tiecodes
      MYSQL_USER: tiecodes
      MYSQL_PASSWORD: tiecodes_dev_password
      MYSQL_ROOT_PASSWORD: tiecodes_root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tiecodes_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tiecodes", "-ptiecodes_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tiecodes_mysql_data:
